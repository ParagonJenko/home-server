# plex/docker-compose.yaml — LXC 220. Library mounted read-only.
# Path is /library/movies and /library/tv all the way through — do not remap.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest   # TODO pin a tag
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/London"
      VERSION: docker
    volumes:
      - /opt/plex/config:/config
      - /data/library/movies:/library/movies:ro
      - /data/library/tv:/library/tv:ro
    devices:
      - /dev/dri:/dev/dri      # hardware transcode — remove this line if no iGPU
    restart: unless-stopped
