# media-pipeline/docker-compose.yaml — LXC 210. qBittorrent + the Arr stack.
# Each service has its own mem_limit (memory cap; disk is bounded by the LXC rootfs
# cap + mergerfs minfreespace + per-app Min Free Space). Secrets go in .env (gitignored).
# Pin each image tag (ENTER markers) before you rely on it; volumes/ports per services.md.
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest   # ENTER: pin a version tag (don't leave :latest)
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes:
      - /opt/qbittorrent/config:/config
      - /data:/data           # torrents + library on ONE mount so imports hardlink
    ports:
      - "8080:8080"           # WebUI
      - "6881:6881"           # torrent peers (tcp)
      - "6881:6881/udp"       # torrent peers (udp)
    mem_limit: 2g
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/sonarr/config:/config, /data:/data ]
    ports: [ "8989:8989" ]
    mem_limit: 1g
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/radarr/config:/config, /data:/data ]
    ports: [ "7878:7878" ]
    mem_limit: 1g
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest        # ENTER: pin a version tag
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/bazarr/config:/config, /data:/data ]
    ports: [ "6767:6767" ]
    mem_limit: 1g
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest      # ENTER: pin a version tag
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/prowlarr/config:/config ]
    ports: [ "9696:9696" ]
    mem_limit: 512m
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest # ENTER: pin a version tag
    environment: { TZ: "Europe/London" }
    mem_limit: 1g                                    # headless Chrome — the hungriest of the stack
    restart: unless-stopped
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:7             # recyclarr has NO :latest tag — pin a major
    user: "1000:1000"
    environment: { TZ: "Europe/London" }
    env_file: .env                                   # SONARR_API_KEY / RADARR_API_KEY
    volumes: [ /opt/recyclarr/config:/config ]       # owns quality profiles (not arr-setup.py)
    restart: unless-stopped
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest      # ENTER: pin a version tag
    environment: { TZ: "Europe/London" }
    env_file: .env                                   # !ENV in config.yaml + TEST_RUN resolve from here
    volumes:
      # decluttarr reads /app/config/config.yaml — mount the file there, not a /config dir
      - /opt/decluttarr/config/config.yaml:/app/config/config.yaml
    mem_limit: 256m
    restart: unless-stopped
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:latest  # ENTER: pin a version tag
    user: "1000:1000"
    environment: { TZ: "Europe/London" }
    env_file: .env                                   # QBIT_USER / QBIT_PASS
    volumes: [ /opt/qbit_manage/config:/config, /data:/data ]
    restart: unless-stopped

  # Maintainerr — watch-based library cleanup (R26: media is reconstructable). Rules like "delete
  # movies unwatched 90d" run against Plex + Radarr/Sonarr; it only calls their APIs, so it needs NO
  # /data mount. Configure rules in its UI (:6246). storage.md.
  # v2's image runs as `USER node` (uid 1000, no PUID/PGID): the host dir behind /opt/data MUST be
  # chowned to 1000 (media-pipeline.sh does it) or the server crash-loops on "Could not ... access
  # (files in) the data directory".
  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest       # ENTER: pin a version tag
    environment: { TZ: "Europe/London" }
    volumes: [ /opt/maintainerr/data:/opt/data ]
    ports: [ "6246:6246" ]
    mem_limit: 512m
    restart: unless-stopped

  # Tdarr — re-encode the library to HEVC/AV1 to shrink it (combined server + internal node). CPU
  # transcoding by default (no GPU passthrough on this unprivileged LXC yet — see the gotcha in
  # media-pipeline.sh); keep it to ONE worker in the UI so it doesn't peg both cores against the Arrs.
  # Transcode scratch goes on the POOL (/data/.tdarr_cache), NOT the 20 G rootfs — a 4K transcode
  # needs tens of GB of scratch. Web UI :8265.
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest          # ENTER: pin a version tag
    environment:
      TZ: "Europe/London"
      PUID: "1000"
      PGID: "1000"
      internalNode: "true"
      inContainer: "true"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      nodeName: "mediaNode"
    ports:
      - "8265:8265"          # web UI
      - "8266:8266"          # server (node <-> server)
    volumes:
      - /opt/tdarr/server:/app/server
      - /opt/tdarr/configs:/app/configs
      - /opt/tdarr/logs:/app/logs
      - /data:/data                      # the library to transcode
      - /data/.tdarr_cache:/temp         # transcode scratch — on the pool, not the capped rootfs
    mem_limit: 2g
    restart: unless-stopped
