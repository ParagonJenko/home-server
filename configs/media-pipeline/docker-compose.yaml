# media-pipeline/docker-compose.yaml — LXC 210. qBittorrent + the Arr stack.
# Each service has its own mem_limit (memory cap; disk is bounded by the LXC rootfs
# cap + mergerfs minfreespace + per-app Min Free Space). Secrets go in .env (gitignored).
# Pin each image tag (ENTER markers) before you rely on it; volumes/ports per services.md.
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest   # ENTER: pin a version tag (don't leave :latest)
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes:
      - /opt/qbittorrent/config:/config
      - /data:/data           # torrents + library on ONE mount so imports hardlink
    mem_limit: 2g
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/sonarr/config:/config, /data:/data ]
    mem_limit: 1g
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/radarr/config:/config, /data:/data ]
    mem_limit: 1g
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest        # ENTER: pin a version tag
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/bazarr/config:/config, /data:/data ]
    mem_limit: 1g
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest      # ENTER: pin a version tag
    environment: { PUID: "1000", PGID: "1000", TZ: "Europe/London" }
    volumes: [ /opt/prowlarr/config:/config ]
    mem_limit: 512m
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest # ENTER: pin a version tag
    environment: { TZ: "Europe/London" }
    mem_limit: 1g                                    # headless Chrome — the hungriest of the stack
    restart: unless-stopped
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest        # ENTER: pin a version tag
    user: "1000:1000"
    environment: { TZ: "Europe/London" }
    volumes: [ /opt/recyclarr/config:/config ]       # owns quality profiles (not arr-setup.py)
    restart: unless-stopped
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest      # ENTER: pin a version tag
    environment: { TZ: "Europe/London" }
    env_file: .env                                   # reads SONARR/RADARR URLs + keys
    mem_limit: 256m
    restart: unless-stopped
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:latest  # ENTER: pin a version tag
    user: "1000:1000"
    environment: { TZ: "Europe/London" }
    volumes: [ /opt/qbit_manage/config:/config, /data:/data ]
    restart: unless-stopped
