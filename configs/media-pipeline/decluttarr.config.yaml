# decluttarr config — removes stalled/failed/orphaned downloads from Sonarr/Radarr so the
# queue self-heals. Mounted at /app/config/config.yaml inside the container. Secrets pulled from
# .env at runtime via !ENV (the same keys the rest of the stack uses), so nothing secret
# lives here. TEST_RUN comes from .env too (env overrides config) — starts True (dry run).
log_level: INFO
test_run: True            # dry run — logs what it WOULD remove, removes nothing. Flip to False below when ready.
timer: 10                 # minutes between queue checks

instances:
  sonarr:
    - base_url: http://sonarr:8989
      api_key: !ENV SONARR_API_KEY
  radarr:
    - base_url: http://radarr:7878
      api_key: !ENV RADARR_API_KEY

# The download client goes in its own section (NOT under instances). 'name' matches the
# qBittorrent client name Sonarr/Radarr use, so decluttarr can read torrent state for the
# qBit-aware jobs (metadata-missing, stalled).
download_clients:
  qbittorrent:
    - base_url: http://qbittorrent:8080
      name: qBittorrent
      username: !ENV QBIT_USER
      password: !ENV QBIT_PASS

jobs:
  remove_failed_downloads: True   # download failed
  remove_failed_imports: True     # grabbed but wouldn't import
  remove_metadata_missing: True   # stuck fetching metadata
  remove_stalled: True            # no connections / no progress
  remove_orphans: True            # media was deleted from the Arr
  # remove_slow / remove_unmonitored left off — they can bin downloads you still want.
