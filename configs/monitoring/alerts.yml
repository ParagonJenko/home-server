# monitoring/alerts.yml — the ONE canonical copy of the alert rules (mounted into
# Prometheus from here by configs/pi/docker-compose.yaml). Alerts inform, they never
# protect (R11) — every "must not happen" is a hard mechanism elsewhere. Fire at 80%.
groups:
  - name: homelab
    rules:
      - alert: DiskUsageHigh
        expr: 100 - (node_filesystem_avail_bytes / node_filesystem_size_bytes * 100) > 80
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} {{ $labels.mountpoint }} over 80%" }

      - alert: ThinPoolMetadataHigh        # the alert closest to unrecoverable (R8)
        expr: lvm_thinpool_metadata_percent > 80
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} thin-pool metadata over 80%" }

      - alert: ServiceDown
        expr: probe_success == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} probe failing" }

      - alert: ProbeFailed
        expr: up == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.job }}/{{ $labels.instance }} scrape target down" }

      - alert: InternalDNSBroken          # AdGuard answering on :53 != resolving *.home.alexjenkinson.com
        expr: probe_success{job="dns"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Internal DNS not resolving *.home.alexjenkinson.com" }

      - alert: SmartFailurePredicted      # off smartmon.sh textfile metrics (R24)
        expr: smartmon_device_smart_healthy == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} {{ $labels.device }} SMART health FAILED — replace the disk" }

      - alert: DiskTempHigh
        expr: smartmon_temperature_celsius > 55
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} {{ $labels.device }} over 55°C" }

      - alert: SmartCollectorStale        # cron/smartmon.sh stopped writing — blind to disk health
        expr: time() - smartmon_last_collect_timestamp_seconds > 3600
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} SMART metrics stale (smartmon.sh not running?)" }

      - alert: InternetDown               # ICMP to 1.1.1.1 failing — WAN/upstream is gone
        expr: probe_success{service="internet"} == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "No internet — ICMP to 1.1.1.1 failing for 3m" }

      - alert: GatewayDown                # the LAN gateway itself is unreachable
        expr: probe_success{service="gateway"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "LAN gateway 192.168.1.1 unreachable" }

      - alert: HighLatency                # round-trip to a box/gateway degraded
        expr: probe_duration_seconds{job="blackbox-icmp"} > 0.15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} ICMP RTT over 150ms for 10m" }

      - alert: TLSCertExpiringSoon        # the wildcard cert nginx serves is close to expiry
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} TLS cert expires in under 14 days" }
