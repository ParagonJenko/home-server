# frigate/metrics-proxy.conf — exposes ONLY Frigate's Prometheus metrics to the LAN.
# Frigate 0.18 serves metrics at /api/metrics, unauthenticated, on the internal :5000 which is
# loopback-bound inside the container (so it's never reachable from the LAN, and /api/metrics on the
# authed :8971 is 401). This nginx runs in Frigate's OWN network namespace (network_mode:
# service:frigate), so it can reach 127.0.0.1:5000 — and it publishes ONLY /metrics on :9101,
# returning 403 for everything else. That keeps the "never expose :5000" rule (services.md): the full
# unauth API stays unreachable; only the metrics endpoint is surfaced, for Prometheus to scrape.
server {
  listen 9101;
  server_name _;

  # the only path that passes through — maps /metrics -> Frigate's /api/metrics
  location = /metrics {
    proxy_pass http://127.0.0.1:5000/api/metrics;
    proxy_set_header Host $host;
  }

  # everything else is denied — the rest of the unauth :5000 API is NOT exposed
  location / { return 403; }
}
