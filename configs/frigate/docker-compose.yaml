# frigate/docker-compose.yaml — LXC 111 (privileged). iGPU for decode.
# UI on 8971 (authenticated). Port 5000 is UNAUTHENTICATED — never proxy or expose it.
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable   # TODO pin a version
    privileged: true
    shm_size: "256mb"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    env_file: .env            # Eufy RTSP creds (gitignored)
    volumes:
      - /opt/frigate/config:/config
      - /opt/frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs: { size: "1000000000" }
    ports:
      - "8971:8971"           # auth UI only — do NOT publish 5000
    restart: unless-stopped
