# frigate/docker-compose.yaml — LXC 111 (privileged). iGPU for decode.
# UI on 8971 (authenticated). Port 5000 is UNAUTHENTICATED — never proxy or expose it.
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable   # ENTER: pin a version tag (don't leave :stable)
    privileged: true
    shm_size: "512mb"        # scales with camera count + resolution; 4 cams need >256mb (Frigate warns <370)
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    env_file: .env            # Eufy RTSP creds (gitignored)
    volumes:
      - /opt/frigate/config:/config
      - /opt/frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs: { size: "1000000000" }
    ports:
      - "8971:8971"           # auth UI only — do NOT publish 5000
      - "9101:9101"           # metrics-only proxy (see frigate-metrics sidecar below); NOT the raw :5000
    restart: unless-stopped

  # Metrics-only reverse proxy: shares Frigate's netns so it can reach the loopback-bound :5000, and
  # exposes ONLY /metrics (-> Frigate's /api/metrics) on :9101. The full unauth :5000 API stays
  # unreachable (services.md). Prometheus scrapes frigate-lxc:9101/metrics.
  frigate-metrics:
    image: nginx:stable-alpine
    network_mode: "service:frigate"
    volumes:
      - ./metrics-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frigate]
    restart: unless-stopped
