# frigate/config.yaml — holds NO secrets (safe as committed). Cameras by NAME, not IP. [R13]
# Frigate 0.15+ removed record.retain — retention is split continuous/motion with
# separate retain blocks under alerts/detections. A config using record.retain.days won't load.
mqtt:
  enabled: false

tls:
  enabled: false          # Nginx fronts it; the login itself stays on

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 14              # the graceful ceiling — must match storage.md
  alerts:
    retain: { days: 14 }
  detections:
    retain: { days: 14 }

# go2rtc restreams each camera once and Frigate pulls from it on localhost. Eufy RTSP
# is finicky for ffmpeg to consume directly, so go2rtc sits in front (it also powers the
# live view). The {VAR}s resolve from .env; the hostnames must resolve FROM INSIDE this
# container (Pi DNS) — if a stream stays down, check `getent hosts cam-*.home.alexjenkinson.com`.
go2rtc:
  streams:
    cam-living-room:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-living-room.home.alexjenkinson.com:554/live0
    cam-kitchen:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-kitchen.home.alexjenkinson.com:554/live0
    cam-bedroom:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-bedroom.home.alexjenkinson.com:554/live0
    cam-basement:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-basement.home.alexjenkinson.com:554/live0

cameras:
  cam-living-room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-living-room
          roles: [detect, record]
  cam-kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-kitchen
          roles: [detect, record]
  cam-bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-bedroom
          roles: [detect, record]
  cam-basement:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-basement
          roles: [detect, record]
  # If a model's RTSP path isn't /live0, change only that camera's go2rtc stream URL.

