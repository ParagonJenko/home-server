# frigate/config.yaml — holds NO secrets (safe as committed). Cameras by NAME, not IP. [R13]
# Frigate 0.18 retention schema: continuous recording is record.retain.days (0 = off);
# event recording is retained per-type under record.alerts / record.detections.
# NOTE: record.continuous.* / record.motion.* are NOT valid keys — a config using them
# fails validation and Frigate boots into safe mode with ZERO cameras loaded.
mqtt:
  enabled: true           # Mosquitto broker + MQTT user now exist in HA (2026-11-18).
                          # Broker creds (FRIGATE_MQTT_USER/PASSWORD) come from .env via enable-mqtt.sh.
  host: homeassistant.home.alexjenkinson.com
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

tls:
  enabled: false          # Nginx fronts it; the :8971 login itself stays on.

record:
  enabled: true
  retain:
    days: 2                # 48h of CONTINUOUS footage — scrub to any moment (fits the 260G LXC)
    mode: all
  # Beyond 48h, Frigate keeps footage around DETECTED OBJECTS (person/animal/car) for 14 days, not raw
  # motion — the recommended security setup (keeps people, drops noise). Needs the detector working;
  # the default CPU detector is slow on 4 cams at 2 cores — add an OpenVINO (iGPU) detector later for
  # snappier detection (the LXC already has /dev/dri passed through).
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

# Object detection on the Intel iGPU (OpenVINO) — much faster than the CPU default, no extra hardware.
# Uses the ssdlite_mobilenet_v2 model bundled in the Frigate image (verified present in /openvino-model);
# /dev/dri is passed through by frigate.sh (privileged LXC). If the GPU ever fails to init, Frigate logs
# the error and this is the first thing to check — a bad detector drops the whole config to safe mode.
detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Tracked objects (global, all cameras). person is Frigate's default; cat is added to track the cats.
# NB: the COCO model detects the SPECIES "cat", not the individual — Misty/Bella/Leo cannot be told
# apart on camera (that's what the PetKit tray's weight ID is for). Cat events record as "detections"
# (14d retention), not "alerts", so they don't push a notification the way person does.
objects:
  track:
    - person
    - cat

# go2rtc restreams each camera once and Frigate pulls from it on localhost (127.0.0.1:8554).
#
# SOURCE = the eufy-sdk bridge (HA add-on on the HA VM, 192.168.1.25:8554). The bridge holds ONE
# P2P session per Eufy camera and restreams it over RTSP keyed by the camera's DEVICE SERIAL. This
# REPLACED the old cam-<room>.home on-camera-RTSP pulls + the DNS-swap hack (the physical cams were
# wired to the wrong cam-<room>.home names). Pulling from the bridge gives: correct-by-serial labels
# (no dependence on which cam-<room>.home DNS points where), and a single P2P session per cam that is
# SHARED with HA's own camera view — so Frigate no longer opens a second client against each camera.
#
# WHERE THE SERIALS COME FROM (re-read after any re-pair / rebuild): HA entity sensor.<room>_stream_url
# (eufy-sdk) = rtsp://<bridge>:8554/<SERIAL>. That sensor shows the add-on's INTERNAL Docker IP
# (172.30.x); from OUTSIDE HA — this Frigate LXC on nuc2 — use the HA host LAN IP 192.168.1.25. The
# eufy-sdk bridge add-on publishes :8554 on the host (verified in its add-on network config: 8554/tcp).
# The bridge's go2rtc RTSP is unauthenticated on the LAN, so these URLs carry no creds (file stays secret-free).
# If a stream stays down: `nc -vz 192.168.1.25 8554` from inside this container, and check the bridge add-on is running.
#
#   living-room T8410 = T8410P412237379E | kitchen  T8410 = T8410P4122381195
#   bedroom     T8417 = T8417T0025011480 | basement T8400 = T8400P3223124F23
go2rtc:
  streams:
    cam-living-room:
      - rtsp://192.168.1.25:8554/T8410P412237379E
    cam-kitchen:
      - rtsp://192.168.1.25:8554/T8410P4122381195
    cam-bedroom:
      - rtsp://192.168.1.25:8554/T8417T0025011480
    cam-basement:
      - rtsp://192.168.1.25:8554/T8400P3223124F23

cameras:
  cam-living-room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-living-room
          roles: [detect, record]
  cam-kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-kitchen
          roles: [detect, record]
  cam-bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-bedroom
          roles: [detect, record]
  cam-basement:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-basement
          roles: [detect, record]
  # If a model's RTSP path isn't /live0, change only that camera's go2rtc stream URL.

