# frigate/config.yaml — holds NO secrets (safe as committed). Cameras by NAME, not IP. [R13]
# Frigate 0.18 retention schema: continuous recording is record.retain.days (0 = off);
# event recording is retained per-type under record.alerts / record.detections.
# NOTE: record.continuous.* / record.motion.* are NOT valid keys — a config using them
# fails validation and Frigate boots into safe mode with ZERO cameras loaded.
mqtt:
  enabled: true           # Mosquitto broker + MQTT user now exist in HA (2026-11-18).
                          # Broker creds (FRIGATE_MQTT_USER/PASSWORD) come from .env via enable-mqtt.sh.
  host: homeassistant.home.alexjenkinson.com
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

tls:
  enabled: false          # Nginx fronts it; the :8971 login itself stays on.

record:
  enabled: true
  retain:
    days: 2                # 48h of CONTINUOUS footage — scrub to any moment (fits the 260G LXC)
    mode: all
  # Beyond 48h, Frigate keeps footage around DETECTED OBJECTS (person/animal/car) for 14 days, not raw
  # motion — the recommended security setup (keeps people, drops noise). Needs the detector working;
  # the default CPU detector is slow on 4 cams at 2 cores — add an OpenVINO (iGPU) detector later for
  # snappier detection (the LXC already has /dev/dri passed through).
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

# go2rtc restreams each camera once and Frigate pulls from it on localhost. Eufy RTSP is
# finicky for ffmpeg to consume directly, so go2rtc sits in front (it also powers the live view).
# The {VAR}s resolve from .env; the cam-*.home.alexjenkinson.com names must resolve FROM INSIDE
# this container (Pi DNS) — if a stream stays down, check `getent hosts cam-*.home.alexjenkinson.com`.
# Until RTSP is enabled on the cams and FRIGATE_RTSP_* is set in .env, the cameras load but show
# "no stream" — that's expected, not a config error.
go2rtc:
  # CAMERA↔HOSTNAME MISMATCH (verified 2026-11-18 by what each feed actually shows): the physical
  # cameras were wired to the wrong cam-<room>.home DNS names. Each cam-<room>.home resolves to a
  # DIFFERENT room's camera, in two swapped pairs — living-room↔bedroom and kitchen↔basement. Rather
  # than redo DHCP reservations + AdGuard rewrites, each Frigate stream below pulls the hostname that
  # ACTUALLY shows its room, so the Frigate camera names (and HA entities + dashboard) are correct:
  #   cam-living-room feed lives at cam-bedroom.home   | cam-bedroom feed  lives at cam-living-room.home
  #   cam-kitchen feed     lives at cam-basement.home  | cam-basement feed lives at cam-kitchen.home
  # To fix "properly" later: swap the AdGuard rewrites so each cam-<room>.home → that room's camera IP,
  # then point each stream back at its own matching hostname.
  streams:
    cam-living-room:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-bedroom.home.alexjenkinson.com:554/live0
    cam-kitchen:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-basement.home.alexjenkinson.com:554/live0
    cam-bedroom:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-living-room.home.alexjenkinson.com:554/live0
    cam-basement:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-kitchen.home.alexjenkinson.com:554/live0

cameras:
  cam-living-room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-living-room
          roles: [detect, record]
  cam-kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-kitchen
          roles: [detect, record]
  cam-bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-bedroom
          roles: [detect, record]
  cam-basement:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam-basement
          roles: [detect, record]
  # If a model's RTSP path isn't /live0, change only that camera's go2rtc stream URL.

