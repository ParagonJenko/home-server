# frigate/config.yaml — holds NO secrets (safe as committed). Cameras by NAME, not IP. [R13]
# Frigate 0.15+ removed record.retain — retention is split continuous/motion with
# separate retain blocks under alerts/detections. A config using record.retain.days won't load.
mqtt:
  enabled: false

tls:
  enabled: false          # Nginx fronts it; the login itself stays on

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 14              # the graceful ceiling — must match storage.md
  alerts:
    retain: { days: 14 }
  detections:
    retain: { days: 14 }

cameras:
  cam-living-room:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-living-room.home.alexjenkinson.com:554/live0
          roles: [detect, record]
  cam-kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-kitchen.home.alexjenkinson.com:554/live0
          roles: [detect, record]
  cam-bedroom:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-bedroom.home.alexjenkinson.com:554/live0
          roles: [detect, record]
  cam-basement:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-basement.home.alexjenkinson.com:554/live0
          roles: [detect, record]
  # NOTE: no HomeBase — confirm each Eufy model exposes standalone RTSP (many need a base).
  # All four share one RTSP user/pass (from .env) and the :554/live0 path. If a model's
  # path differs, change just that camera's input; the hostname is what network.md + AdGuard pin.

