# Deployed live via HA-MCP and committed here as source of truth.
# Faithful copy of the HA scripts; drop into /config/scripts.yaml on a rebuild.
office_focus:
  alias: 'Office: focus'
  icon: mdi:brightness-7
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 5300
      brightness_pct: 100
      transition: 2
office_break:
  alias: 'Office: break'
  icon: mdi:coffee
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 3000
      brightness_pct: 70
      transition: 2
end_work:
  alias: End work
  icon: mdi:briefcase-off
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.work_lighting
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 2700
      brightness_pct: 60
      transition: 5
relax_mode:
  alias: Relax mode
  icon: mdi:sofa
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.work_lighting
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 2000
      brightness_pct: 25
      transition: 4
  - action: light.turn_on
    target:
      entity_id: light.living_room_living_room
    data:
      color_temp_kelvin: 2202
      brightness_pct: 30
      transition: 4
gaming_mode:
  alias: Gaming mode
  icon: mdi:gamepad-variant
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.work_lighting
  - action: light.turn_off
    target:
      entity_id: light.office_office_light
    data:
      transition: 2
  - action: light.turn_on
    target:
      entity_id:
      - light.office_hue_play_1
      - light.office_hue_play_2
      - light.office_backlights
    data:
      rgb_color:
      - 150
      - 50
      - 230
      brightness_pct: 55
      transition: 2
