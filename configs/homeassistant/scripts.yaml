# Deployed live via HA-MCP and committed here as source of truth.
# Faithful copy of the HA scripts; drop into /config/scripts.yaml on a rebuild.
office_focus:
  alias: 'Office: focus'
  icon: mdi:brightness-7
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 5300
      brightness_pct: 100
      transition: 2
office_break:
  alias: 'Office: break'
  icon: mdi:coffee
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 3000
      brightness_pct: 70
      transition: 2
end_work:
  alias: End work
  icon: mdi:briefcase-off
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.work_lighting
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 2700
      brightness_pct: 60
      transition: 5
