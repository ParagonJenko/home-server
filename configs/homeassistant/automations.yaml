# Deployed live via HA-MCP and committed here as the source of truth.
# Faithful copy of the HA automations; drop into /config/automations.yaml on a rebuild
# (or just restore the HA backup tarball). See README.md.
- id: '1795039639885'
  alias: Doorbell → phone (snapshot)
  description: 'Doorbell pressed: push a live doorbell snapshot to Alex''s phone.'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.doorbell_ringing
    to: 'on'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🔔 Doorbell
      message: Someone's at the front door
      data:
        image: /api/camera_proxy/camera.doorbell
        tag: doorbell
        group: security
- id: '1795039640817'
  alias: Person detected while away
  description: 'Frigate sees a person in a room while Alex is away: push an alert with that room''s camera snapshot.'
  mode: parallel
  max: 10
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_person
    - binary_sensor.kitchen_person
    - binary_sensor.bedroom_person
    - binary_sensor.basement_person
    to: 'on'
  conditions:
  - condition: state
    entity_id: person.alex_jenkinson
    state: not_home
  variables:
    cam: '{{ {''binary_sensor.living_room_person'':''camera.living_room_cam_living_room'',''binary_sensor.kitchen_person'':''camera.living_room_cam_kitchen'',''binary_sensor.bedroom_person'':''camera.bedroom_cam_bedroom'',''binary_sensor.basement_person'':''camera.utility_cam_basement''}.get(trigger.entity_id,''camera.doorbell'')
      }}'
    room: '{{ trigger.to_state.attributes.friendly_name | replace('' Person'','''') }}'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 👁️ Person detected — you're away
      message: Someone is in the {{ room }}
      data:
        image: /api/camera_proxy/{{ cam }}
        tag: person_away_{{ room }}
        group: security
- id: '1795039641592'
  alias: Arrive home (dark) → living room lights
  description: When Alex gets home while the sun is below the horizon, turn on the living room lights.
  mode: single
  triggers:
  - trigger: state
    entity_id: person.alex_jenkinson
    to: home
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room_living_room
- id: '1795039642577'
  alias: Leave home → all lights off
  description: When Alex leaves (debounced 2 min), turn off all lights. Single occupant, so not_home = empty house.
  mode: single
  triggers:
  - trigger: state
    entity_id: person.alex_jenkinson
    to: not_home
    for:
      minutes: 2
  actions:
  - action: light.turn_off
    target:
      entity_id: all
- id: '1795039995065'
  alias: Litter tray full → hourly phone alert
  description: 'PetKit Pura Max (RobertD502 integration): binary_sensor.litter_tray_wastebin correctly reports a full waste
    bin. Fires when it goes on, re-nags hourly, self-clears when emptied.'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.litter_tray_wastebin
    to: 'on'
  - trigger: time_pattern
    hours: /1
  conditions:
  - condition: state
    entity_id: binary_sensor.litter_tray_wastebin
    state: 'on'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🚽 Litter tray full
      message: The PetKit waste bin is full — empty it.
      data:
        tag: litter_full
        group: home
- id: '1795040260037'
  alias: 'Bin day: Monday heads-up'
  description: Every Monday at 12:00, tell Alex which bin is out this week (next collection within 5 days).
  mode: single
  triggers:
  - trigger: time
    at: '12:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.waste_collection_schedule_cheshire_east_council
    data:
      start_date_time: '{{ now() }}'
      end_date_time: '{{ now() + timedelta(days=5) }}'
    response_variable: ev
  - variables:
      items: '{{ ev[''calendar.waste_collection_schedule_cheshire_east_council''].events }}'
  - condition: template
    value_template: '{{ items | count > 0 }}'
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🗑️ Bin this week
      message: This week's bin is {{ items[0].summary }} — out Wednesday.
      data:
        tag: bin_week
        group: home
- id: '1795040260770'
  alias: 'Bin day: night-before reminder'
  description: At 20:00 the evening before a collection, remind Alex to put the right bin out.
  mode: single
  triggers:
  - trigger: time
    at: '20:00:00'
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.waste_collection_schedule_cheshire_east_council
    data:
      start_date_time: '{{ today_at(''23:00'') }}'
      end_date_time: '{{ today_at(''23:00'') + timedelta(days=1) }}'
    response_variable: ev
  - variables:
      items: '{{ ev[''calendar.waste_collection_schedule_cheshire_east_council''].events }}'
  - condition: template
    value_template: '{{ items | count > 0 }}'
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🌙 Bin night
      message: Put the {{ items[0].summary }} out tonight — collection tomorrow morning.
      data:
        tag: bin_night
        group: home
- id: '1795111688049'
  alias: 'Infra: host unreachable → phone'
  description: 'A homelab host (Prometheus ICMP bridge) unreachable for 10 min: push an alert naming it.'
  mode: parallel
  max: 6
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.infra_nuc1
    - binary_sensor.infra_nuc2
    - binary_sensor.infra_pbs
    - binary_sensor.infra_pi
    to: 'off'
    for:
      minutes: 10
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🔌 Host unreachable
      message: '{{ trigger.to_state.attributes.friendly_name | replace(''Infra '','''') }} has been unreachable for 10 min.'
      data:
        tag: infra_down_{{ trigger.entity_id }}
        group: infra
- id: '1795111688783'
  alias: 'Infra: service(s) down → phone'
  description: 'One or more blackbox-http probes failing for 5 min (sensor.infra_services_down > 0): push an alert.'
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sensor.infra_services_down
    above: 0
    for:
      minutes: 15
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: ⚠️ Service down
      message: '{{ states(''sensor.infra_services_down'') }} service(s) are down — check Grafana.'
      data:
        tag: infra_services_down
        group: infra
- id: '1795123263298'
  alias: 'Vitamins: reset for the new day'
  description: Untick the daily vitamins toggle at 04:00 so it's fresh each morning.
  mode: single
  triggers:
  - trigger: time
    at: 04:00:00
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.vitamins_taken
- id: '1795123264172'
  alias: 'Vitamins: reminder if not taken'
  description: Morning prompt (09:00) and an evening nag (19:30) to take vitamins, only if the toggle is still off. Push carries
    a 'Mark taken' button.
  mode: single
  triggers:
  - trigger: time
    at: 09:00:00
  - trigger: time
    at: '19:30:00'
  conditions:
  - condition: state
    entity_id: input_boolean.vitamins_taken
    state: 'off'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 💊 Vitamins
      message: You haven't ticked your vitamins today.
      data:
        tag: vitamins
        actions:
        - action: VITAMINS_TAKEN
          title: Mark taken
- id: '1795123264992'
  alias: 'Vitamins: mark taken from notification'
  description: Tapping 'Mark taken' on the reminder ticks the toggle and clears the notification.
  mode: single
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: VITAMINS_TAKEN
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.vitamins_taken
  - action: notify.mobile_app_alexs_iphone
    data:
      message: clear_notification
      data:
        tag: vitamins
- id: '1795203406117'
  alias: 'Office: work-mode daylight'
  description: On weekdays during work hours, hold the office at bright cool-white for focus. Fires at work start and whenever
    the office light is switched on during work hours.
  mode: restart
  triggers:
  - trigger: time
    at: input_datetime.work_start
  - trigger: state
    entity_id: light.office_office
    to: 'on'
  conditions:
  - condition: time
    after: input_datetime.work_start
    before: input_datetime.work_end
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: input_boolean.work_lighting
    state: 'on'
  - condition: state
    entity_id: light.office_office
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 5300
      brightness_pct: 100
      transition: 3
- id: '1795203406832'
  alias: 'Office: clock-out warm cue'
  description: At work end on weekdays, shift the office to warm/dim as a visible 'stop working' boundary. Only if the office
    light is on.
  mode: single
  triggers:
  - trigger: time
    at: input_datetime.work_end
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: input_boolean.work_lighting
    state: 'on'
  - condition: state
    entity_id: light.office_office
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.office_office
    data:
      color_temp_kelvin: 2700
      brightness_pct: 60
      transition: 5
- id: '1795203407536'
  alias: 'Bedroom: sunrise wake'
  description: Gentle 20-minute ramp to soft daylight in the bedroom on weekday mornings.
  mode: single
  triggers:
  - trigger: time
    at: input_datetime.bedroom_wake_time
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom_bedroom
    data:
      color_temp_kelvin: 4000
      brightness_pct: 80
      transition: 1200
- id: '1795203408273'
  alias: 'Bedroom: evening wind-down'
  description: On weekday nights at the wind-down time, if the bedroom light is on, drop it to warm/dim to protect sleep.
  mode: single
  triggers:
  - trigger: time
    at: input_datetime.bedroom_wind_down
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: light.bedroom_bedroom
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom_bedroom
    data:
      color_temp_kelvin: 2200
      brightness_pct: 30
      transition: 60
- id: '1795203408978'
  alias: 'Office: movement nudge'
  description: A gentle Play-bar flash through the workday to prompt standing up / looking away. Lunch at 12:00, so the midday
    gap is 12:00-13:00. Toggle with input_boolean.work_movement_nudge.
  mode: single
  triggers:
  - trigger: time
    at: '10:30:00'
  - trigger: time
    at: '14:00:00'
  - trigger: time
    at: '16:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: input_boolean.work_lighting
    state: 'on'
  - condition: state
    entity_id: input_boolean.work_movement_nudge
    state: 'on'
  - condition: state
    entity_id: light.office_hue_play_1
    state: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.office_hue_play_1
    data:
      flash: long
- id: '1795203783988'
  alias: 'Work lighting: re-arm each morning'
  description: Turn the work-lighting master back on at 04:00 on weekdays, so tapping 'End work' early only ends today, not
    tomorrow.
  mode: single
  triggers:
  - trigger: time
    at: 04:00:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.work_lighting
- id: '1795213977620'
  alias: 'Litter: record emptied'
  description: When the waste bin clears (full -> not full), stamp 'last emptied' = now, which resets the days-since counter
    and the predicted-full date.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.litter_tray_wastebin
    from: 'on'
    to: 'off'
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.litter_last_emptied
    data:
      timestamp: '{{ now().timestamp() }}'
- id: '1795213978391'
  alias: 'Litter: learn fill interval'
  description: When the bin reports full, fold the days-since-emptied (the just-completed cycle length) into the fill-days
    estimate with 2:1 smoothing, so the prediction self-calibrates. Skips spurious cycles under 1 day.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.litter_tray_wastebin
    from: 'off'
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: sensor.litter_days_since_emptied
    above: 1
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.litter_fill_days
    data:
      value: '{{ (((states(''input_number.litter_fill_days'') | float(5) * 2) + states(''sensor.litter_days_since_emptied'')
        | float(5)) / 3) | round(1) }}'
- id: '1795213979121'
  alias: 'Litter: heads-up before full'
  description: A day before the waste bin is predicted to fill (and it isn't already full), push a heads-up with the predicted
    date.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.litter_fill_due_soon
    from: 'off'
    to: 'on'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🐾 Litter bin filling up
      message: The waste bin is likely full within a day (≈{{ as_timestamp(states('sensor.litter_predicted_full')) | timestamp_custom('%a
        %-d %b') }}). Empty it soon.
      data:
        tag: litter_due_soon
        group: home
- id: '1795214839126'
  alias: 'Energy: accrue daily cost'
  description: Just after midnight, add yesterday's total electricity + gas cost (both include standing charge) to the month-to-date
    and tick the days-accrued counter. Feeds the projected-bill run-rate.
  mode: single
  triggers:
  - trigger: time
    at: 00:10:00
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.energy_month_to_date
    data:
      value: '{{ (states(''input_number.energy_month_to_date'')|float(0) + states(''sensor.octopus_energy_electricity_19m0059512_1610012030180_previous_accumulative_cost'')|float(0)
        + states(''sensor.octopus_energy_gas_e6s17297892061_9384989210_previous_accumulative_cost'')|float(0)) | round(2)
        }}'
  - action: counter.increment
    target:
      entity_id: counter.energy_days_accrued
- id: '1795214840551'
  alias: 'Energy: reset monthly totals'
  description: On the 1st, zero the month-to-date and days-accrued so the projection restarts for the new month. Runs just
    before the daily accrual.
  mode: single
  triggers:
  - trigger: time
    at: 00:05:00
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.energy_month_to_date
    data:
      value: 0
  - action: counter.reset
    target:
      entity_id: counter.energy_days_accrued
- id: '1795214841217'
  alias: 'Energy: projected over budget'
  description: When the projected monthly bill crosses the budget, push an alert once.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.energy_over_budget
    from: 'off'
    to: 'on'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 💷 Energy over budget
      message: Projected this month ≈ £{{ states('sensor.energy_projected_bill') }} — over your £{{ states('input_number.energy_monthly_budget')|int
        }} budget.
      data:
        tag: energy_budget
        group: home
- id: '1795215269320'
  alias: 'Steps: goal reached'
  description: Celebrate once when today's steps cross the goal. Positive reinforcement, fires once per day.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.step_goal_met
    from: 'off'
    to: 'on'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 🎉 Step goal hit
      message: Nice one — {{ states('sensor.alexs_iphone_steps') }} steps today, goal smashed.
      data:
        tag: step_goal
        group: home
- id: '1795215270081'
  alias: 'Steps: evening nudge'
  description: One gentle after-work nudge at 17:30 if the step goal isn't met yet. Encouraging, not naggy - fires at most
    once a day.
  mode: single
  triggers:
  - trigger: time
    at: '17:30:00'
  conditions:
  - condition: state
    entity_id: binary_sensor.step_goal_met
    state: 'off'
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: 👟 Fancy a walk?
      message: You're at {{ states('sensor.alexs_iphone_steps') }} steps — about {{ states('sensor.steps_to_goal') }} to your
        {{ states('input_number.step_goal')|int }} goal. A quick loop would do it, no pressure.
      data:
        tag: step_nudge
        group: home
- id: '1795215539343'
  alias: 'Weight: Sunday weigh-in reminder'
  description: Every Sunday morning, a gentle reminder to do the weekly weigh-in. Weekly cadence tracks the trend without
    fixating on daily noise.
  mode: single
  triggers:
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: time
    weekday:
    - sun
  actions:
  - action: notify.mobile_app_alexs_iphone
    data:
      title: ⚖️ Weekly weigh-in
      message: Hop on the scales when you're up — same time each week keeps the trend honest. Currently {{ states('sensor.alexs_iphone_weight')
        }} kg, {{ states('sensor.weight_to_target') }} kg from your {{ states('input_number.weight_target')|int }}kg target.
      data:
        tag: weigh_in
        group: home
