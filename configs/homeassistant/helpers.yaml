# Reference export of HA zones + persons (registry-managed). Diffable record, not auto-loaded.
zone:
- name: Macclesfield Train Station
  latitude: 53.25944064320947
  longitude: -2.1222772381034076
  radius: 40
  icon: mdi:map-marker
  passive: false
- name: Doncaster
  latitude: 53.51115414503215
  longitude: -1.135862684295688
  radius: 3312
  icon: mdi:map-marker
  passive: false
- name: London Office
  latitude: 51.52117351989759
  longitude: -0.0809378516281356
  radius: 55
  icon: mdi:office-building
  passive: false
person:
- name: Alex Jenkinson
  device_trackers:
  - device_tracker.alexs_iphone
- name: frigate
  device_trackers: []
input_boolean:
- name: Vitamins taken
  icon: mdi:pill
- name: Work lighting
  icon: mdi:desk-lamp
  initial: true
- name: Work movement nudge
  icon: mdi:seat-recline-normal
  initial: true
input_datetime:
- name: Work start
  icon: mdi:clock-start
  has_time: true
  has_date: false
  initial: 08:00:00
- name: Work end
  icon: mdi:clock-end
  has_time: true
  has_date: false
  initial: '17:00:00'
- name: Bedroom wake time
  icon: mdi:weather-sunset-up
  has_time: true
  has_date: false
  initial: 07:40:00
- name: Bedroom wind down
  icon: mdi:weather-night
  has_time: true
  has_date: false
  initial: '21:30:00'
template:
- name: Misty last seen
  device_class: timestamp
  state: '{{ ([states.sensor.misty_latest_weight.last_changed, states.sensor.misty_last_use_duration.last_changed] | max).isoformat()
    }}'
- name: Bella last seen
  device_class: timestamp
  state: '{{ ([states.sensor.bella_latest_weight.last_changed, states.sensor.bella_last_use_duration.last_changed] | max).isoformat()
    }}'
- name: Leo last seen
  device_class: timestamp
  state: '{{ ([states.sensor.leo_latest_weight.last_changed, states.sensor.leo_last_use_duration.last_changed] | max).isoformat()
    }}'
