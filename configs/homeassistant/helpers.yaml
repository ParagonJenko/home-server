# Reference export of HA zones + persons (registry-managed). Diffable record, not auto-loaded.
zone:
- name: Macclesfield Train Station
  latitude: 53.25944064320947
  longitude: -2.1222772381034076
  radius: 40
  icon: mdi:map-marker
  passive: false
- name: Doncaster
  latitude: 53.51115414503215
  longitude: -1.135862684295688
  radius: 3312
  icon: mdi:map-marker
  passive: false
- name: London Office
  latitude: 51.52117351989759
  longitude: -0.0809378516281356
  radius: 55
  icon: mdi:office-building
  passive: false
person:
- name: Alex Jenkinson
  device_trackers:
  - device_tracker.alexs_iphone
- name: frigate
  device_trackers: []
input_boolean:
- name: Vitamins taken
  icon: mdi:pill
- name: Work lighting
  icon: mdi:desk-lamp
  initial: true
- name: Work movement nudge
  icon: mdi:seat-recline-normal
  initial: true
input_datetime:
- name: Work start
  icon: mdi:clock-start
  has_time: true
  has_date: false
  initial: 08:00:00
- name: Work end
  icon: mdi:clock-end
  has_time: true
  has_date: false
  initial: '17:00:00'
- name: Bedroom wake time
  icon: mdi:weather-sunset-up
  has_time: true
  has_date: false
  initial: 07:40:00
- name: Bedroom wind down
  icon: mdi:weather-night
  has_time: true
  has_date: false
  initial: '21:30:00'
- name: Litter last emptied
  icon: mdi:delete-clock
  has_time: true
  has_date: true
  initial: '2026-11-20 22:00:00'
input_number:
- name: Litter fill days
  icon: mdi:calendar-clock
  min: 1
  max: 30
  step: 0.5
  initial: 5
  mode: box
  unit_of_measurement: d
- name: Energy month to date
  icon: mdi:cash-multiple
  min: 0
  max: 2000
  step: 0.01
  initial: 8.54
  mode: box
  unit_of_measurement: GBP
- name: Energy monthly budget
  icon: mdi:target
  min: 0
  max: 2000
  step: 5
  initial: 250
  mode: box
  unit_of_measurement: GBP
- name: Step goal
  icon: mdi:shoe-print
  min: 1000
  max: 30000
  step: 500
  initial: 6000
  mode: box
  unit_of_measurement: steps
counter:
- name: Energy days accrued
  icon: mdi:calendar-range
  initial: 1
  step: 1
  minimum: 0
template:
- name: Misty last seen
  device_class: timestamp
  state: '{{ ([states.sensor.misty_latest_weight.last_changed, states.sensor.misty_last_use_duration.last_changed] | max).isoformat()
    }}'
- name: Bella last seen
  device_class: timestamp
  state: '{{ ([states.sensor.bella_latest_weight.last_changed, states.sensor.bella_last_use_duration.last_changed] | max).isoformat()
    }}'
- name: Leo last seen
  device_class: timestamp
  state: '{{ ([states.sensor.leo_latest_weight.last_changed, states.sensor.leo_last_use_duration.last_changed] | max).isoformat()
    }}'
- name: Litter days since emptied
  unit_of_measurement: d
  state: '{{ ((now().timestamp() - state_attr(''input_datetime.litter_last_emptied'',''timestamp'') | float(now().timestamp()))
    / 86400) | round(1) }}'
- name: Litter predicted full
  device_class: timestamp
  state: '{{ (as_datetime(state_attr(''input_datetime.litter_last_emptied'',''timestamp'') | float(now().timestamp()) + states(''input_number.litter_fill_days'')
    | float(5) * 86400) | as_local).isoformat() }}'
- name: Energy projected bill
  device_class: monetary
  unit_of_measurement: GBP
  state: '{% set mtd = states(''input_number.energy_month_to_date'')|float(0) %}{% set days = states(''counter.energy_days_accrued'')|int(1)
    %}{% set nm = (now().replace(day=28)+timedelta(days=4)).replace(day=1) %}{% set dim = (nm - timedelta(days=1)).day %}{{
    ((mtd / ([days,1]|max)) * dim) | round(2) }}'
- name: Steps to goal
  unit_of_measurement: steps
  state: '{{ [states(''input_number.step_goal'')|int(6000) - states(''sensor.alexs_iphone_steps'')|int(0), 0] | max }}'
- name: Step goal progress
  unit_of_measurement: '%'
  state: '{{ [ (states(''sensor.alexs_iphone_steps'')|int(0) / ([states(''input_number.step_goal'')|int(6000),1]|max) * 100)
    | round, 100] | min }}'
template_binary_sensor:
- name: Litter fill due soon
  device_class: problem
  state: '{{ not is_state(''binary_sensor.litter_tray_wastebin'',''on'') and (state_attr(''input_datetime.litter_last_emptied'',''timestamp'')
    | float(now().timestamp()) + states(''input_number.litter_fill_days'') | float(5) * 86400) - now().timestamp() < 86400
    }}'
- name: Energy over budget
  device_class: problem
  state: '{{ states(''sensor.energy_projected_bill'')|float(0) > states(''input_number.energy_monthly_budget'')|float(999999)
    }}'
- name: Step goal met
  state: '{{ states(''sensor.alexs_iphone_steps'')|int(0) >= states(''input_number.step_goal'')|int(6000) }}'
