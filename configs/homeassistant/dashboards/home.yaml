# configs/homeassistant/dashboards/home.yaml — the asquared Home Assistant dashboard.
# Multi-tab Lovelace, modern "sections" views + Mushroom cards, built for the home's REAL entities
# (dumped from /api/states). Tabs: Overview · Lights · Climate · Security · Media · Phone · System.
#
# HACS cards required (all already installed): Mushroom (piitaya/lovelace-mushroom),
# mini-graph-card (kalkih/mini-graph-card). Optional polish already present: card-mod, Bubble Card.
#
# Deploy: HA → Settings → Dashboards → (this dashboard) → ⋮ → Edit → ⋮ → Raw configuration editor →
# paste this whole file → Save. (Or ./configs/homeassistant/ha-config.sh — see monitoring-exporters.md.)
#
# Cameras: no camera.* entities exist yet (Eufy/Frigate not set up). The Security tab has a ready
# slot — uncomment the picture-glance block and add the camera entities once they appear.

title: asquared
views:
  # =====================================================================================
  # 🏠 OVERVIEW
  # =====================================================================================
  - title: Overview
    path: overview
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set h = now().hour %}
              {{ 'Good morning' if h < 12 else 'Good afternoon' if h < 18 else 'Good evening' }}, Alex
            secondary: >-
              {{ now().strftime('%A %-d %B') }} · {{ states('weather.home') | replace('-', ' ') | title }},
              {{ state_attr('weather.home','temperature') }}°
            icon: >-
              {% set c = states('weather.home') %}
              {% if c == 'sunny' %}mdi:weather-sunny
              {% elif c == 'clear-night' %}mdi:weather-night
              {% elif 'rain' in c %}mdi:weather-rainy
              {% elif 'snow' in c %}mdi:weather-snowy
              {% elif 'cloud' in c %}mdi:weather-cloudy
              {% else %}mdi:weather-partly-cloudy{% endif %}
            icon_color: amber
            tap_action: { action: none }
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: person.alex_jenkinson
                icon_color: >-
                  {{ 'green' if is_state('person.alex_jenkinson','home') else 'blue-grey' }}
                content_info: state
              - type: template
                icon: mdi:lightbulb-group
                content: >-
                  {{ states.light | selectattr('state','eq','on') | list | count }} on
                icon_color: >-
                  {{ 'amber' if (states.light | selectattr('state','eq','on') | list | count) > 0 else 'grey' }}
                tap_action: { action: navigate, navigation_path: lights }
              - type: entity
                entity: sensor.alexs_iphone_battery_level
                icon: mdi:cellphone
                icon_color: >-
                  {% set b = states('sensor.alexs_iphone_battery_level') | int(100) %}
                  {{ 'red' if b < 20 else 'orange' if b < 40 else 'green' }}
                content_info: state
              - type: weather
                entity: weather.home
                show_conditions: true
                show_temperature: true

      # Quick controls
      - type: grid
        cards:
          - type: heading
            heading: ⚡ Quick controls
            heading_style: title
          - type: custom:mushroom-template-card
            primary: All lights
            secondary: >-
              {{ states.light | selectattr('state','eq','on') | list | count }} of
              {{ states.light | list | count }} on
            icon: mdi:lightbulb-group
            icon_color: >-
              {{ 'amber' if (states.light | selectattr('state','eq','on') | list | count) > 0 else 'grey' }}
            tap_action: { action: call-service, service: light.toggle, target: { entity_id: all } }
            hold_action: { action: call-service, service: light.turn_off, target: { entity_id: all } }
          - type: custom:mushroom-entity-card
            entity: switch.adaptive_lighting_adaptive_lighting
            name: Adaptive Lighting
            icon: mdi:theme-light-dark
            tap_action: { action: toggle }
          - type: custom:mushroom-person-card
            entity: person.alex_jenkinson
            layout: horizontal

      # Today
      - type: grid
        cards:
          - type: heading
            heading: 📅 Today
            heading_style: title
          - type: custom:mushroom-template-card
            primary: General Waste
            secondary: "{{ states('sensor.waste_collection_schedule_general_waste') }}"
            icon: mdi:trash-can
            icon_color: >-
              {% set s = states('sensor.waste_collection_schedule_general_waste') | lower %}
              {{ 'red' if ('today' in s or 'tomorrow' in s or s == '0' or s == '1') else 'blue-grey' }}
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Mixed Recycling
            secondary: "{{ states('sensor.waste_collection_schedule_mixed_recycling') }}"
            icon: mdi:recycle
            icon_color: >-
              {% set s = states('sensor.waste_collection_schedule_mixed_recycling') | lower %}
              {{ 'red' if ('today' in s or 'tomorrow' in s or s == '0' or s == '1') else 'green' }}
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Sun
            secondary: >-
              ↑ {{ as_timestamp(states('sensor.sun_next_rising')) | timestamp_custom('%H:%M') }}
              · ↓ {{ as_timestamp(states('sensor.sun_next_setting')) | timestamp_custom('%H:%M') }}
            icon: mdi:weather-sunset
            icon_color: amber
            tap_action: { action: none }

      # Needs attention — only shows cards when something is actually wrong
      - type: grid
        cards:
          - type: heading
            heading: 🔔 Needs attention
            heading_style: title
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.hue_motion_sensor_battery
                below: 25
            card:
              type: custom:mushroom-entity-card
              entity: sensor.hue_motion_sensor_battery
              name: Hue Motion battery low
              icon_color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.alexs_iphone_battery_level
                below: 20
            card:
              type: custom:mushroom-entity-card
              entity: sensor.alexs_iphone_battery_level
              name: iPhone battery low
              icon_color: red
          - type: custom:mushroom-template-card
            primary: Updates available
            secondary: >-
              {{ states.update | selectattr('state','eq','on') | list | count }} waiting
            icon: mdi:package-up
            icon_color: >-
              {{ 'orange' if (states.update | selectattr('state','eq','on') | list | count) > 0 else 'green' }}
            tap_action: { action: navigate, navigation_path: system }
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: binary_sensor.hue_motion_sensor_motion
                icon: mdi:motion-sensor
                content: Office
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.hue_motion_sensor_motion','on') else 'grey' }}
              - type: template
                entity: binary_sensor.living_room_alexa_motion
                icon: mdi:motion-sensor
                content: Living
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.living_room_alexa_motion','on') else 'grey' }}
              - type: template
                entity: binary_sensor.bedroom_alexa_motion
                icon: mdi:motion-sensor
                content: Bedroom
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.bedroom_alexa_motion','on') else 'grey' }}

      # Now playing — only when something is playing
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: media_player.everywhere
                state_not: "off"
              - condition: state
                entity: media_player.everywhere
                state_not: "idle"
              - condition: state
                entity: media_player.everywhere
                state_not: "unavailable"
            card:
              type: custom:mushroom-media-player-card
              entity: media_player.everywhere
              name: Now playing
              use_media_info: true
              media_controls: [play_pause_stop, next]
              volume_controls: [volume_buttons]

  # =====================================================================================
  # 💡 LIGHTS
  # =====================================================================================
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 💡 Rooms
            heading_style: title
          - type: custom:mushroom-light-card
            entity: light.office_office
            name: Office
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.living_room_living_room
            name: Living Room
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.bedroom_bedroom
            name: Bedroom
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.upstairs
            name: Upstairs
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true

      - type: grid
        cards:
          - type: heading
            heading: 🎚️ Office accents
            heading_style: title
          - type: custom:mushroom-light-card
            entity: light.office_hue_play_1
            name: Hue Play 1
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.office_hue_play_2
            name: Hue Play 2
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.office_backlights
            name: Office Backlights
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true

      - type: grid
        cards:
          - type: heading
            heading: 🎬 Scenes
            heading_style: title
          - type: tile
            entity: select.office_office_scene
            name: Office scene
          - type: tile
            entity: select.office_backlights_scene
            name: Backlights scene
          - type: tile
            entity: select.living_room_living_room_scene
            name: Living Room scene
          - type: tile
            entity: select.bedroom_bedroom_scene
            name: Bedroom scene
          - type: tile
            entity: select.upstairs_scene
            name: Upstairs scene

      - type: grid
        cards:
          - type: heading
            heading: 🌗 Adaptive lighting
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: switch.adaptive_lighting_adaptive_lighting
            name: Enabled
            tap_action: { action: toggle }
          - type: custom:mushroom-entity-card
            entity: switch.adaptive_lighting_adaptive_lighting_adapt_brightness
            name: Adapt brightness
            tap_action: { action: toggle }
          - type: custom:mushroom-entity-card
            entity: switch.adaptive_lighting_adaptive_lighting_adapt_color
            name: Adapt colour
            tap_action: { action: toggle }
          - type: custom:mushroom-entity-card
            entity: switch.adaptive_lighting_adaptive_lighting_sleep_mode
            name: Sleep mode
            icon: mdi:power-sleep
            tap_action: { action: toggle }

  # =====================================================================================
  # 🌡️ CLIMATE
  # =====================================================================================
  - title: Climate
    path: climate
    icon: mdi:thermometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🌡️ Temperature
            heading_style: title
          - type: custom:mini-graph-card
            name: Temperature (24h)
            hours_to_show: 24
            points_per_hour: 2
            line_width: 3
            entities:
              - entity: sensor.hue_motion_sensor_temperature
                name: Office (Hue)
              - entity: sensor.bedroom_alexa_temperature
                name: Bedroom (Alexa)

      - type: grid
        cards:
          - type: heading
            heading: ☀️ Light levels
            heading_style: title
          - type: custom:mini-graph-card
            name: Illuminance (24h)
            hours_to_show: 24
            points_per_hour: 2
            line_width: 3
            entities:
              - entity: sensor.hue_motion_sensor_illuminance
                name: Office
              - entity: sensor.living_room_alexa_illuminance
                name: Living Room
              - entity: sensor.bedroom_alexa_illuminance
                name: Bedroom

      - type: grid
        cards:
          - type: heading
            heading: 🏃 Motion
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: binary_sensor.hue_motion_sensor_motion
            name: Office
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.hue_motion_sensor_motion','on') else 'grey' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.living_room_alexa_motion
            name: Living Room
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.living_room_alexa_motion','on') else 'grey' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.bedroom_alexa_motion
            name: Bedroom
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.bedroom_alexa_motion','on') else 'grey' }}

  # =====================================================================================
  # 🎥 SECURITY  (camera-ready — Eufy/Frigate add here later)
  # =====================================================================================
  - title: Security
    path: security
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 📍 Presence
            heading_style: title
          - type: custom:mushroom-person-card
            entity: person.alex_jenkinson
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: device_tracker.alexs_iphone
                icon: mdi:cellphone-marker
              - type: template
                icon: mdi:map-marker
                content: "{{ states('sensor.alexs_iphone_geocoded_location').split(',')[0] }}"

      - type: grid
        cards:
          - type: heading
            heading: 🚪 Doorbell & motion
            heading_style: title
          - type: custom:mushroom-template-card
            primary: Doorbell
            secondary: Tap to simulate a ring (Alexa announce)
            icon: mdi:doorbell-video
            icon_color: blue
            tap_action:
              { action: call-service, service: button.press, target: { entity_id: button.me_alexjenkinson_com_doorbell_rung } }
          - type: custom:mushroom-entity-card
            entity: binary_sensor.hue_motion_sensor_motion
            name: Office motion
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.hue_motion_sensor_motion','on') else 'grey' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.living_room_alexa_motion
            name: Living Room motion
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.living_room_alexa_motion','on') else 'grey' }}
          - type: custom:mushroom-entity-card
            entity: binary_sensor.bedroom_alexa_motion
            name: Bedroom motion
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'red' if is_state('binary_sensor.bedroom_alexa_motion','on') else 'grey' }}

      # ---- Cameras: Eufy -> Frigate (LXC 111) -> Frigate HA integration. The person/motion chips +
      # overlays work NOW via MQTT; the picture tiles stay blank until RTSP is enabled on the Eufy
      # cams (setup-cameras.sh). HA prefixed each id with the area the device landed in — e.g. the
      # kitchen cam is camera.living_room_cam_kitchen. IDs are fixed; don't "correct" them here.
      - type: grid
        cards:
          - type: heading
            heading: 🎥 Cameras
            heading_style: title
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: binary_sensor.living_room_cam_living_room_person_occupancy
                icon: mdi:cctv
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.living_room_cam_living_room_person_occupancy','on') else 'grey' }}
                content: Living Room
              - type: template
                entity: binary_sensor.living_room_cam_kitchen_person_occupancy
                icon: mdi:cctv
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.living_room_cam_kitchen_person_occupancy','on') else 'grey' }}
                content: Kitchen
              - type: template
                entity: binary_sensor.bedroom_cam_bedroom_person_occupancy
                icon: mdi:cctv
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.bedroom_cam_bedroom_person_occupancy','on') else 'grey' }}
                content: Bedroom
              - type: template
                entity: binary_sensor.utility_cam_basement_person_occupancy
                icon: mdi:cctv
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.utility_cam_basement_person_occupancy','on') else 'grey' }}
                content: Basement
          - type: picture-glance
            title: Living Room
            camera_image: camera.living_room_cam_living_room
            camera_view: auto
            entities:
              - entity: binary_sensor.living_room_cam_living_room_motion
              - entity: binary_sensor.living_room_cam_living_room_person_occupancy
          - type: picture-glance
            title: Kitchen
            camera_image: camera.living_room_cam_kitchen
            camera_view: auto
            entities:
              - entity: binary_sensor.living_room_cam_kitchen_motion
              - entity: binary_sensor.living_room_cam_kitchen_person_occupancy
          - type: picture-glance
            title: Bedroom
            camera_image: camera.bedroom_cam_bedroom
            camera_view: auto
            entities:
              - entity: binary_sensor.bedroom_cam_bedroom_motion
              - entity: binary_sensor.bedroom_cam_bedroom_person_occupancy
          - type: picture-glance
            title: Basement
            camera_image: camera.utility_cam_basement
            camera_view: auto
            entities:
              - entity: binary_sensor.utility_cam_basement_motion
              - entity: binary_sensor.utility_cam_basement_person_occupancy

  # =====================================================================================
  # 🔊 MEDIA
  # =====================================================================================
  - title: Media
    path: media
    icon: mdi:speaker
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🔊 Speakers
            heading_style: title
          - type: custom:mushroom-media-player-card
            entity: media_player.everywhere
            name: Everywhere (all)
            use_media_info: true
            media_controls: [play_pause_stop, previous, next]
            volume_controls: [volume_buttons, volume_slider]
          - type: custom:mushroom-media-player-card
            entity: media_player.office_alexa
            name: Office
            use_media_info: true
            media_controls: [play_pause_stop, next]
            volume_controls: [volume_slider]
          - type: custom:mushroom-media-player-card
            entity: media_player.living_room_alexa
            name: Living Room
            use_media_info: true
            media_controls: [play_pause_stop, next]
            volume_controls: [volume_slider]
          - type: custom:mushroom-media-player-card
            entity: media_player.bedroom_alexa
            name: Bedroom
            use_media_info: true
            media_controls: [play_pause_stop, next]
            volume_controls: [volume_slider]
          - type: custom:mushroom-media-player-card
            entity: media_player.upstairs
            name: Upstairs
            use_media_info: true
            media_controls: [play_pause_stop, next]
            volume_controls: [volume_slider]

      - type: grid
        cards:
          - type: heading
            heading: 🔕 Do not disturb
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: switch.office_alexa_do_not_disturb
            name: Office
            icon: mdi:bell-off
          - type: custom:mushroom-entity-card
            entity: switch.living_room_alexa_do_not_disturb
            name: Living Room
            icon: mdi:bell-off
          - type: custom:mushroom-entity-card
            entity: switch.bedroom_alexa_do_not_disturb
            name: Bedroom
            icon: mdi:bell-off

  # =====================================================================================
  # 📱 PHONE
  # =====================================================================================
  - title: Phone
    path: phone
    icon: mdi:cellphone
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 📱 iPhone
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: sensor.alexs_iphone_battery_level
            name: Battery
            icon: mdi:battery
            icon_color: >-
              {% set b = states('sensor.alexs_iphone_battery_level') | int(100) %}
              {{ 'red' if b < 20 else 'orange' if b < 40 else 'green' }}
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.alexs_iphone_battery_state
                icon: mdi:power-plug
              - type: entity
                entity: sensor.alexs_iphone_connection_type
                icon: mdi:wifi
              - type: entity
                entity: sensor.alexs_iphone_activity
                icon: mdi:run
              - type: entity
                entity: binary_sensor.alexs_iphone_focus
                icon: mdi:moon-waning-crescent
          - type: custom:mushroom-entity-card
            entity: sensor.alexs_iphone_storage
            name: Storage
            icon: mdi:harddisk

      - type: grid
        cards:
          - type: heading
            heading: 🏃 Activity
            heading_style: title
          - type: custom:mini-graph-card
            name: Steps (today)
            hours_to_show: 24
            points_per_hour: 1
            line_width: 3
            entities:
              - entity: sensor.alexs_iphone_steps
                name: Steps
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.alexs_iphone_walking_running_distance
                icon: mdi:map-marker-distance
              - type: entity
                entity: sensor.alexs_iphone_flights_climbed
                icon: mdi:stairs-up
              - type: entity
                entity: sensor.alexs_iphone_exercise_time
                icon: mdi:timer
              - type: entity
                entity: sensor.alexs_iphone_stand_hours
                icon: mdi:human-handsup
          # (Clinical health sensors — heart rate, blood pressure, glucose, weight, VO2 — are in HA
          # but left off this dashboard by default. Add them here if you want them visible.)

  # =====================================================================================
  # 🖥️ SYSTEM
  # =====================================================================================
  - title: System
    path: system
    icon: mdi:server
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: ⬆️ Updates
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - entity: update.home_assistant_core_update
              - entity: update.home_assistant_operating_system_update
              - entity: update.home_assistant_supervisor_update
              - type: section
                label: HACS
              - entity: update.mushroom
              - entity: update.mini_graph_card
              - entity: update.bubble_card
              - entity: update.card_mod
              - entity: update.eufy_security
              - entity: update.webrtc_camera
              - entity: update.adaptive_lighting
              - entity: update.waste_collection_schedule

      - type: grid
        cards:
          - type: heading
            heading: 💾 Backups
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: sensor.backup_backup_manager_state
            name: Backup state
            icon: mdi:backup-restore
            icon_color: >-
              {{ 'green' if is_state('sensor.backup_backup_manager_state','idle') else 'orange' }}
          - type: custom:mushroom-entity-card
            entity: sensor.backup_last_successful_automatic_backup
            name: Last successful
            icon: mdi:check-circle
          - type: custom:mushroom-entity-card
            entity: sensor.backup_next_scheduled_automatic_backup
            name: Next scheduled
            icon: mdi:calendar-clock
          - type: custom:mushroom-entity-card
            entity: sensor.backup_last_successful_automatic_backup_size
            name: Last size
            icon: mdi:database

      - type: grid
        cards:
          - type: heading
            heading: 🖥️ Homelab (Grafana)
            heading_style: title
          - type: markdown
            content: >
              The server stack — Proxmox, media (Plex/Arrs/Maintainerr/Tdarr), PBS backups, DNS, NVR
              — is monitored in **Grafana**, not Home Assistant.


              • [🏠 Homelab overview](http://pi.home.alexjenkinson.com:3000/d/homelab-overview)

              • [🎞️ Tdarr transcoding](http://pi.home.alexjenkinson.com:3000/d/tdarr)

              • [🧹 Maintainerr cleanup](http://pi.home.alexjenkinson.com:3000/d/maintainerr)

              • [🎬 Media stack](http://pi.home.alexjenkinson.com:3000/d/media)
