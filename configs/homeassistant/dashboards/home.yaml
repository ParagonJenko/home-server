# configs/homeassistant/dashboards/home.yaml — a Lovelace dashboard for Home Assistant, built for the
# asquared home's actual entities. Uses the modern "sections" view + Mushroom cards + mini-graph-card.
#
# HACS cards required: Mushroom (piitaya/lovelace-mushroom), mini-graph-card (kalkih/mini-graph-card).
# Optional polish: card-mod, Bubble Card.
#
# To use: HA → Settings → Dashboards → + Add dashboard → New dashboard from scratch → open it →
# top-right ⋮ → Edit dashboard → ⋮ → Raw configuration editor → paste this whole file → Save.
# (Or deploy via ./configs/homeassistant/ha-config.sh — see runbooks/monitoring-exporters.md.)

title: Home
views:
  - title: Home
    path: home
    type: sections
    max_columns: 3
    sections:
      # ---------------- Lights ----------------
      - type: grid
        cards:
          - type: heading
            heading: 💡 Lights
            heading_style: title
          - type: custom:mushroom-template-card
            primary: All lights
            secondary: >-
              {{ states.light | selectattr('state','eq','on') | list | count }} on
            icon: mdi:lightbulb-group
            icon_color: >-
              {{ 'amber' if states.light | selectattr('state','eq','on') | list | count > 0 else 'grey' }}
            tap_action: { action: call-service, service: light.toggle, target: { entity_id: all } }
            hold_action: { action: call-service, service: light.turn_off, target: { entity_id: all } }
          - type: custom:mushroom-light-card
            entity: light.office_office
            name: Office
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.living_room_living_room
            name: Living Room
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.bedroom_bedroom
            name: Bedroom
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.upstairs
            name: Upstairs
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.office_hue_play_1
            name: Hue Play 1
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.office_hue_play_2
            name: Hue Play 2
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.office_backlights
            name: Office Backlights
            show_brightness_control: true
            use_light_color: true
            collapsible_controls: true

      # ---------------- Waste collection ----------------
      - type: grid
        cards:
          - type: heading
            heading: 🗑️ Waste collection
            heading_style: title
          - type: custom:mushroom-template-card
            primary: General Waste
            secondary: "{{ states('sensor.waste_collection_schedule_general_waste') }}"
            icon: mdi:trash-can
            icon_color: >-
              {% set s = states('sensor.waste_collection_schedule_general_waste') | lower %}
              {{ 'red' if ('today' in s or 'tomorrow' in s) else 'blue-grey' }}
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Mixed Recycling
            secondary: "{{ states('sensor.waste_collection_schedule_mixed_recycling') }}"
            icon: mdi:recycle
            icon_color: >-
              {% set s = states('sensor.waste_collection_schedule_mixed_recycling') | lower %}
              {{ 'red' if ('today' in s or 'tomorrow' in s) else 'green' }}
            multiline_secondary: true

      # ---------------- Environment ----------------
      - type: grid
        cards:
          - type: heading
            heading: 🌡️ Environment
            heading_style: title
          - type: custom:mini-graph-card
            name: Temperature
            hours_to_show: 24
            points_per_hour: 2
            line_width: 3
            entities:
              - entity: sensor.hue_motion_sensor_temperature
                name: Office (Hue)
              - entity: sensor.bedroom_alexa_temperature
                name: Bedroom (Alexa)
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: binary_sensor.hue_motion_sensor_motion
                icon: mdi:motion-sensor
                icon_color: >-
                  {{ 'red' if is_state('binary_sensor.hue_motion_sensor_motion','on') else 'grey' }}
              - type: entity
                entity: binary_sensor.living_room_alexa_motion
                icon: mdi:motion-sensor
              - type: entity
                entity: binary_sensor.bedroom_alexa_motion
                icon: mdi:motion-sensor
              - type: entity
                entity: sensor.hue_motion_sensor_illuminance
                icon: mdi:brightness-5

      # ---------------- Status ----------------
      - type: grid
        cards:
          - type: heading
            heading: 🔋 Status
            heading_style: title
          - type: custom:mushroom-entity-card
            entity: sensor.hue_motion_sensor_battery
            name: Hue Motion Battery
            icon_color: >-
              {% set b = states('sensor.hue_motion_sensor_battery') | int(100) %}
              {{ 'red' if b < 20 else 'orange' if b < 50 else 'green' }}
          - type: custom:mushroom-entity-card
            entity: switch.adaptive_lighting_adaptive_lighting
            name: Adaptive Lighting
            icon: mdi:theme-light-dark
          - type: custom:mushroom-template-card
            primary: Sunrise / Sunset
            secondary: >-
              ↑ {{ as_timestamp(states('sensor.sun_next_rising')) | timestamp_custom('%H:%M') }}
              · ↓ {{ as_timestamp(states('sensor.sun_next_setting')) | timestamp_custom('%H:%M') }}
            icon: mdi:weather-sunset
            icon_color: amber
