# pi/docker-compose.yaml — AdGuard + Prometheus + Alertmanager + Grafana + exporters.
# ALL services on host networking (three things break on a bridge — see rules.md D0).
# Mounts alerts.yml from ../monitoring/ so there is ONE canonical copy of the rules.
# Secrets: Grafana password in .env; Discord webhook in alertmanager/discord-webhook-url
# (both gitignored, both chmod 600).
services:
  adguardhome:
    image: adguard/adguardhome:latest    # ENTER: pin a version tag (don't leave :latest)
    network_mode: host                    # move admin UI to :8081 in the wizard (Grafana owns 3000)
    volumes: [ ./adguard/work:/opt/adguardhome/work, ./adguard/conf:/opt/adguardhome/conf ]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    volumes:
      - ./prometheus:/etc/prometheus
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:latest
    network_mode: host
    volumes: [ ./alertmanager:/etc/alertmanager ]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    network_mode: host
    env_file: .env
    volumes: [ ./grafana:/etc/grafana/provisioning, grafana-data:/var/lib/grafana ]
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:latest
    network_mode: host
    volumes: [ ./blackbox:/etc/blackbox_exporter ]    # http/https/icmp/dns probe modules
    cap_add: [ NET_RAW ]                               # required for the icmp prober
    restart: unless-stopped
  node_exporter:
    image: prom/node-exporter:latest
    network_mode: host
    # textfile collector: picks up smartmon.prom (SMART) written on the Pi host, like the NUCs.
    command: [ '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector' ]
    volumes: [ /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro ]
    restart: unless-stopped

  # ---- application exporters (secrets all in .env; see runbooks/monitoring-exporters.md) ----
  # per-VM/LXC CPU/mem/disk across both nodes. Multi-target: Prometheus passes ?target=<node ip>,
  # the exporter connects to that node's :8006 API with the PVE_* token from .env. Binds :9221.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    network_mode: host
    env_file: .env
    restart: unless-stopped

  # Plex: active streams, bandwidth, library counts. Needs a Plex token (PLEX_TOKEN in .env). :9000
  plex-exporter:
    image: ghcr.io/jsclayton/prometheus-plex-exporter:latest
    network_mode: host
    environment:
      PLEX_SERVER: http://plex-lxc.home.alexjenkinson.com:32400
      PLEX_TOKEN: ${PLEX_TOKEN}
    restart: unless-stopped

  # qBittorrent: global up/down speed, torrent counts by state, ratio. Needs WebUI creds. :9238
  qbittorrent-exporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:latest
    network_mode: host
    environment:
      QBITTORRENT_HOST: media-pipeline.home.alexjenkinson.com
      QBITTORRENT_PORT: 8080
      QBITTORRENT_USER: ${QBIT_USER}
      QBITTORRENT_PASS: ${QBIT_PASS}
      EXPORTER_PORT: 9238
    restart: unless-stopped

  # The Arrs (exportarr, one container each): queue depth, missing, health, indexers.
  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:latest
    command: ["sonarr"]
    network_mode: host
    environment: { PORT: 9707, URL: "http://media-pipeline.home.alexjenkinson.com:8989", APIKEY: "${SONARR_API_KEY}" }
    restart: unless-stopped
  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:latest
    command: ["radarr"]
    network_mode: host
    environment: { PORT: 9708, URL: "http://media-pipeline.home.alexjenkinson.com:7878", APIKEY: "${RADARR_API_KEY}" }
    restart: unless-stopped
  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:latest
    command: ["prowlarr"]
    network_mode: host
    environment: { PORT: 9710, URL: "http://media-pipeline.home.alexjenkinson.com:9696", APIKEY: "${PROWLARR_API_KEY}" }
    restart: unless-stopped
volumes:
  grafana-data:
