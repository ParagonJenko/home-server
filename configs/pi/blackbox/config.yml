# configs/pi/blackbox/config.yml — blackbox-exporter modules. Mounted at
# /etc/blackbox_exporter/config.yml (its default path). Mounting a config REPLACES the
# built-in defaults, so http_2xx is redefined here, plus a dns module for internal-DNS checks.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
      valid_status_codes: []          # any 2xx counts as success

  # Resolve a known *.home name against the target DNS server (AdGuard). Used by the
  # prometheus job_name: dns — success means AdGuard is actually answering internal names.
  dns_home:
    prober: dns
    timeout: 5s
    dns:
      query_name: pi.home.alexjenkinson.com
      query_type: A
      preferred_ip_protocol: ip4
      valid_rcodes: [NOERROR]
