# configs/pi/blackbox/config.yml — blackbox-exporter modules. Mounted at
# /etc/blackbox_exporter/config.yml (its default path). Mounting a config REPLACES the
# built-in defaults, so everything the prometheus jobs use is defined here.
modules:
  # strict: only a 2xx counts (used for health endpoints like Grafana /api/health).
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
      valid_status_codes: []

  # "is the service up?" — a login/redirect/auth wall still means it's responding, so accept
  # 2xx/3xx/401/403. insecure_skip_verify lets it probe PBS/nginx TLS (self-signed / internal).
  http_up:
    prober: http
    timeout: 15s        # was 5s — LXC-210 services (the Arr stack) can take >5s under load, so a
                        # batch of them flapped "down" every scrape. A dead service fails fast
                        # (connection refused), so a generous timeout only forgives SLOW, not DOWN.
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 401, 403]
      tls_config:
        insecure_skip_verify: true

  # ICMP reachability + latency (gateway, internet, each box). Needs NET_RAW on the container
  # (added in docker-compose.yaml).
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  # TCP connect — used to probe cameras' RTSP port (:554). A camera serving RTSP to Frigate has
  # :554 open; this is a truer "camera up" signal than ICMP (Eufy cams can sleep ping but keep
  # the stream up).
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  # Resolve a known *.home name against the target DNS server (AdGuard) — internal-DNS health.
  dns_home:
    prober: dns
    timeout: 5s
    dns:
      query_name: pi.home.alexjenkinson.com
      query_type: A
      preferred_ip_protocol: ip4
      valid_rcodes: [NOERROR]
