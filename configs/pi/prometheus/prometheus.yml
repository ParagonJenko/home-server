# configs/pi/prometheus/prometheus.yml — scrape + alerting config for the Pi stack.
# Mounted at /etc/prometheus/prometheus.yml; alerts.yml is mounted alongside from ../monitoring/.
# All services use host networking, so targets are host:port. [R11 — alerts inform, never protect]
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: prometheus
    static_configs: [ { targets: ['localhost:9090'] } ]

  - job_name: alertmanager
    static_configs: [ { targets: ['localhost:9093'] } ]

  # node_exporter on every host (:9100). node_*, lvm_thinpool_* and smartmon_* arrive here
  # (the last two via the textfile collector). nuc1/nuc2 DOWN until H2; pbs DOWN until it runs
  # node_exporter (L-roadmap). The network panels and SMART graphs come from these.
  - job_name: node
    static_configs:
      - { targets: ['localhost:9100'],     labels: { instance: pi } }
      - { targets: ['192.168.1.2:9100'],   labels: { instance: nuc1 } }
      - { targets: ['192.168.1.3:9100'],   labels: { instance: nuc2 } }
      - { targets: ['192.168.1.5:9100'],   labels: { instance: pbs } }

  # ---- UPTIME: probe every service through the blackbox exporter (:9115) ----
  # http_up treats a login/redirect/auth wall as "up" (service responding). probe_success==0
  # for 5m fires ServiceDown. Add a new service's URL here when you build it.
  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_up] }
    static_configs:
      - { targets: ['http://plex-lxc.home.alexjenkinson.com:32400/identity'], labels: { service: plex } }
      - { targets: ['http://frigate-lxc.home.alexjenkinson.com:8971/'],       labels: { service: frigate } }
      - { targets: ['http://homeassistant.home.alexjenkinson.com:80/'],       labels: { service: homeassistant } }
      - { targets: ['http://amp.home.alexjenkinson.com:8080/'],               labels: { service: amp } }
      - { targets: ['http://media-pipeline.home.alexjenkinson.com:8989/'],    labels: { service: sonarr } }
      - { targets: ['http://media-pipeline.home.alexjenkinson.com:7878/'],    labels: { service: radarr } }
      - { targets: ['http://media-pipeline.home.alexjenkinson.com:6767/'],    labels: { service: bazarr } }
      - { targets: ['http://media-pipeline.home.alexjenkinson.com:9696/'],    labels: { service: prowlarr } }
      - { targets: ['http://media-pipeline.home.alexjenkinson.com:8080/'],    labels: { service: qbittorrent } }
      - { targets: ['http://pi.home.alexjenkinson.com:8081/'],                labels: { service: adguard } }
      - { targets: ['http://localhost:3000/api/health'],                     labels: { service: grafana } }
      - { targets: ['https://pbs.home.alexjenkinson.com:8007/'],              labels: { service: pbs } }
      - { targets: ['https://plex.home.alexjenkinson.com/'],                  labels: { service: nginx-tls } }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [service],     target_label: instance }
      - { target_label: __address__,    replacement: localhost:9115 }

  # ---- NETWORK: ICMP reachability + latency (gateway, internet, each box) ----
  - job_name: blackbox-icmp
    metrics_path: /probe
    params: { module: [icmp] }
    static_configs:
      - { targets: ['192.168.1.1'], labels: { service: gateway } }
      - { targets: ['1.1.1.1'],     labels: { service: internet } }
      - { targets: ['192.168.1.2'], labels: { service: nuc1 } }
      - { targets: ['192.168.1.3'], labels: { service: nuc2 } }
      - { targets: ['192.168.1.4'], labels: { service: pi } }
      - { targets: ['192.168.1.5'], labels: { service: pbs } }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [service],     target_label: instance }
      - { target_label: __address__,    replacement: localhost:9115 }

  # ---- CAMERAS: probe each camera's RTSP port (:554). DOWN -> Frigate likely lost the stream. ----
  - job_name: blackbox-cameras
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      - { targets: ['cam-living-room.home.alexjenkinson.com:554'], labels: { service: cam-living-room } }
      - { targets: ['cam-kitchen.home.alexjenkinson.com:554'],     labels: { service: cam-kitchen } }
      - { targets: ['cam-bedroom.home.alexjenkinson.com:554'],     labels: { service: cam-bedroom } }
      - { targets: ['cam-basement.home.alexjenkinson.com:554'],    labels: { service: cam-basement } }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [service],     target_label: instance }
      - { target_label: __address__,    replacement: localhost:9115 }

  # Internal DNS health: ask AdGuard (:53) to resolve a *.home name. job=dns feeds InternalDNSBroken.
  - job_name: dns
    metrics_path: /probe
    params: { module: [dns_home] }
    static_configs:
      - { targets: ['127.0.0.1:53'], labels: { service: adguard-dns } }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [service],     target_label: instance }
      - { target_label: __address__,    replacement: localhost:9115 }

  # ---- Proxmox pve-exporter (:9221): per-VM/LXC + node metrics. Multi-target like blackbox —
  # Prometheus passes each node's IP as ?target=, the exporter queries that node's :8006 API.
  - job_name: pve
    metrics_path: /pve
    params: { module: [default] }
    static_configs:
      - { targets: ['192.168.1.2'], labels: { node: nuc1 } }
      - { targets: ['192.168.1.3'], labels: { node: nuc2 } }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: localhost:9221 }

  # ---- Media stack exporters ----
  # Plex exporter runs on the Plex LXC (220, amd64), NOT the Pi (its image is amd64-only). Scraped
  # across the LAN at plex-lxc:9000. See runbooks/monitoring-exporters.md "Plex — runs on nuc1".
  - job_name: plex
    static_configs: [ { targets: ['plex-lxc.home.alexjenkinson.com:9000'] } ]
  - job_name: qbittorrent
    static_configs: [ { targets: ['localhost:9238'] } ]
  - job_name: sonarr
    static_configs: [ { targets: ['localhost:9707'] } ]
  - job_name: radarr
    static_configs: [ { targets: ['localhost:9708'] } ]
  - job_name: prowlarr
    static_configs: [ { targets: ['localhost:9710'] } ]

  # ---- PBS backup exporter (:10019) ----
  - job_name: pbs
    static_configs: [ { targets: ['localhost:10019'] } ]

  # ---- AdGuard exporter (:9617) ----
  - job_name: adguard
    static_configs: [ { targets: ['localhost:9617'] } ]

  # ---- Frigate native Prometheus metrics (camera/detection FPS, inference, storage) ----
  # Frigate serves /metrics UNauthenticated on its main port :8971 (the internal :5000 is
  # localhost-only by design; /api/metrics on :8971 is the authed one, 401). LAN scrape only.
  - job_name: frigate
    metrics_path: /metrics
    static_configs: [ { targets: ['frigate-lxc.home.alexjenkinson.com:8971'] } ]
