# configs/pi/alertmanager/alertmanager.yml — routes every alert to Discord as a per-severity-coloured
# embed. Alertmanager can't colour by severity itself (native Discord = firing-red/resolved-green only),
# so it POSTs to the alert-relay (configs/pi/alert-relay/app.py, :9095), which renders one embed per
# alert — critical=red, warning=amber, resolved=green — with Impact/What/Fix/Where from the rule's
# annotations. The relay reads the same gitignored discord-webhook-url file. [R21]
global:
  resolve_timeout: 5m

route:
  receiver: discord
  # One embed PER alert: group by every distinguishing label so no two alerts share a group, and the
  # relay posts them individually (so each is emoji-reactable). group_wait 10s keeps a burst prompt.
  group_by: ['alertname', 'instance', 'device', 'service', 'mountpoint', 'job']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    webhook_configs:
      - url: http://localhost:9095/alert
        send_resolved: true
