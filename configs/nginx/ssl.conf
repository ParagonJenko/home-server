# homelab-ssl.conf — shared TLS settings, included by every proxied :443 server block.
# Cert is the Let's Encrypt wildcard for *.home.alexjenkinson.com, issued and renewed
# by enable-tls.sh (acme.sh + Cloudflare DNS-01). Deployed to /etc/nginx/snippets/. [R20]
ssl_certificate     /etc/nginx/certs/home.alexjenkinson.com.crt;
ssl_certificate_key /etc/nginx/certs/home.alexjenkinson.com.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
# HSTS is safe here (every proxied name is HTTPS now). Leave off until you've confirmed
# every service answers on https, or a browser will refuse the http fallback:
# add_header Strict-Transport-Security "max-age=31536000" always;
