# nginx/homelab.conf — LXC 240 reverse proxy. HTTP-only on :80 (.home has no CA). [R13 R20]
# Routes by Host: header. Backends addressed BY NAME via the Pi resolver, with the
# VARIABLE proxy_pass form so Nginx honours DNS TTL (a bare hostname is cached forever).
# Fill the resolver IP (the Pi) before `nginx -t`. See services.md for the full table.

resolver {{PI_IP}} valid=10s;      # ENTER: replace {{PI_IP}} with the Pi's IP (the one literal IP allowed, R13)

# Example — one proxied service. Repeat per services.md routing table.
server {
    listen 80;
    server_name plex.home;
    location / {
        set $backend plex-lxc.home;          # backend NAME, not IP
        proxy_pass http://$backend:32400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    listen 80;
    server_name frigate.home;
    location / {
        set $backend frigate-lxc.home;       # :8971 is the AUTH UI — never proxy :5000 (R13)
        proxy_pass http://$backend:8971;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;              # Frigate live view uses websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# The four Arrs share LXC 210 (media-pipeline.home), one front name each, different ports.
server {
    listen 80;
    server_name sonarr.home;
    location / { set $backend media-pipeline.home; proxy_pass http://$backend:8989;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
server {
    listen 80;
    server_name radarr.home;
    location / { set $backend media-pipeline.home; proxy_pass http://$backend:7878;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
server {
    listen 80;
    server_name bazarr.home;
    location / { set $backend media-pipeline.home; proxy_pass http://$backend:6767;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
server {
    listen 80;
    server_name prowlarr.home;
    location / { set $backend media-pipeline.home; proxy_pass http://$backend:9696;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
# qBittorrent is fussy behind a proxy: it validates the Host header and expects the
# X-Forwarded-* set. In its WebUI, turn ON "Bypass authentication for clients on
# localhost" OFF and enable the reverse-proxy option (or disable host-header
# validation) — otherwise proxied requests 401 (see the gotcha in E1).
server {
    listen 80;
    server_name qbittorrent.home;
    location / {
        set $backend media-pipeline.home;
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
    }
}
