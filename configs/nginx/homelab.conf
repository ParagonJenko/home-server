    location / { set $backend media-pipeline.home.alexjenkinson.com; proxy_pass http://$backend:6767;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
    listen 443 ssl;
    server_name prowlarr.home.alexjenkinson.com;
    include /etc/nginx/snippets/homelab-ssl.conf;
    location / { set $backend media-pipeline.home.alexjenkinson.com; proxy_pass http://$backend:9696;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
# qBittorrent validates the Host header behind a proxy and expects X-Forwarded-*.
# In its WebUI (Options -> Web UI) enable "Reverse proxy support" and whitelist the
# proxy, or proxied requests 401 (see the gotcha in E1).
server {
    listen 443 ssl;
    server_name qbittorrent.home.alexjenkinson.com;
    include /etc/nginx/snippets/homelab-ssl.conf;
    location / {
        set $backend media-pipeline.home.alexjenkinson.com;
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
