# nginx/homelab.conf — LXC 240 reverse proxy. HTTPS on :443 with a Let's Encrypt
# wildcard for *.home.alexjenkinson.com (issued by enable-tls.sh via Cloudflare DNS);
# :80 redirects to :443. Backends addressed BY NAME via the Pi resolver, with the
# VARIABLE proxy_pass form so Nginx honours DNS TTL (a bare hostname is cached forever).
# Fill the resolver IP (the Pi) before `nginx -t`. See services.md for the full table. [R13 R20]

resolver {{PI_IP}} valid=10s;      # ENTER: replace {{PI_IP}} with the Pi's IP (the one literal IP allowed, R13)

# Everything on :80 -> :443 (Host preserved so the redirect lands on the same name).
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Example — one proxied service. Repeat per services.md routing table.
server {
    listen 443 ssl;
    server_name plex.home.alexjenkinson.com;
    include /etc/nginx/snippets/homelab-ssl.conf;
    location / {
        set $backend plex-lxc.home.alexjenkinson.com;   # backend NAME, not IP
        proxy_pass http://$backend:32400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 443 ssl;
    server_name frigate.home.alexjenkinson.com;
    include /etc/nginx/snippets/homelab-ssl.conf;
    location / {
        set $backend frigate-lxc.home.alexjenkinson.com;   # :8971 is the AUTH UI — never proxy :5000 (R13)
        proxy_pass http://$backend:8971;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;              # Frigate live view uses websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# The four Arrs share LXC 210 (media-pipeline.home.alexjenkinson.com), one front name each, different ports.
server {
    listen 443 ssl;
    server_name sonarr.home.alexjenkinson.com;
    include /etc/nginx/snippets/homelab-ssl.conf;
    location / { set $backend media-pipeline.home.alexjenkinson.com; proxy_pass http://$backend:8989;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
