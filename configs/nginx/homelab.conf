# nginx/homelab.conf — LXC 240 reverse proxy. HTTP-only on :80 (.home has no CA). [R13 R20]
# Routes by Host: header. Backends addressed BY NAME via the Pi resolver, with the
# VARIABLE proxy_pass form so Nginx honours DNS TTL (a bare hostname is cached forever).
# Fill the resolver IP (the Pi) before `nginx -t`. See services.md for the full table.

resolver {{PI_IP}} valid=10s;      # TODO: replace with the Pi's IP (the one literal IP allowed, R13)

# Example — one proxied service. Repeat per services.md routing table.
server {
    listen 80;
    server_name plex.home;
    location / {
        set $backend plex-lxc.home;          # backend NAME, not IP
        proxy_pass http://$backend:32400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
